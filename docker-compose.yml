services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/users.db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - users-management-data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # Cache data is disposable; do not write snapshots or append-only files.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  users-management-data:
    # Reuse the volume from the earlier standalone Docker workflow.
    name: users-management-data
