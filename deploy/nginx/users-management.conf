# Nginx: the public front door. Passes every request to the app on 127.0.0.1:8000.
# Install on the server:
#   sudo cp deploy/nginx/users-management.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# Certbot (2.4) adds the HTTPS part and the HTTP -> HTTPS redirect to the installed copy.

server {
    listen 80;
    server_name 54-173-106-241.sslip.io;

    # Requests here are small JSON forms; reject anything larger than 1 MB.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Tell the app who the real visitor is (otherwise every request looks like it came from Nginx).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast if the app is down or stuck, instead of leaving visitors waiting.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
